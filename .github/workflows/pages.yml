name: Test, build and deploy to GitHub Pages

# Runs the checks on every push and pull request. Deploys to GitHub Pages only from the default branch, and only if the checks pass.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:subpath
      - run: npm run test:e2e:trainer
      - run: npm run test:e2e:notebook
      - run: npm run test:e2e:home
      - run: npm run test:e2e:voice
      - run: npm run test:e2e:stockfish
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
